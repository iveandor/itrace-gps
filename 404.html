<title>페이지를 찾을 수 없습니다 — iTrace &amp; iLog &amp; iLogMobile</title>
<meta name="robots" content="noindex, follow" />

<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root {
    --coral: #FF7A45;
    --coral-dark: #E05A25;
    --coral-tint: #FFF1E6;
    --cream: #FBF6EF;
    --ink: #1A1A1A;
    --ink-muted: #6B6B6B;
    --line: rgba(26, 26, 26, 0.08);
    --r-pill: 999px;
    --shadow-cta: 0 8px 24px rgba(255,122,69,.32);
    --ease: cubic-bezier(.2,0,0,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard Variable', 'Pretendard', 'Inter', -apple-system,
                 BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: var(--cream);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .card { text-align: center; max-width: 480px; }
  .code {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 20px; border-radius: var(--r-pill);
    background: var(--coral-tint); color: var(--coral-dark);
    font-weight: 700; font-size: 15px; letter-spacing: .04em;
    margin-bottom: 20px;
  }
  h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--ink-muted); font-size: 16px; margin: 0 0 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 48px; padding: 0 24px; border-radius: var(--r-pill);
    background: var(--coral); color: #fff;
    font-weight: 600; font-size: 15px;
    box-shadow: var(--shadow-cta);
    transition: transform .2s var(--ease), background-color .2s var(--ease);
  }
  .btn:hover { background: var(--coral-dark); transform: translateY(-1px); }
  .links {
    margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center;
    font-size: 14px; color: var(--ink-muted);
  }
  .links a:hover { color: var(--coral-dark); }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력된 페이지예요.<br />아래 버튼으로 홈으로 돌아가실 수 있습니다.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
    <nav class="links">
      <a href="/user_guide.html">사용자 가이드</a>
      <a href="/permissions_guide.html">권한 설정 가이드</a>
      <a href="/privacy_policy.html">개인정보 처리방침</a>
      <a href="/terms_of_use.html">이용약관</a>
      <a href="/account_deletion.html">계정 및 데이터 삭제</a>
    </nav>
  </main>
</body>
</html>
